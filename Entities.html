<!-- example = like we want to display a copyright symbol(special character). For that we need to use an entity which is a predefined code for special characters -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 </head>
 <body>
    &copy; 2024 All rights reserved. This is an example of using an entity to display a copyright symbol.
 </body>
 </html>
